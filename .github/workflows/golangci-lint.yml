name: golangci-lint
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  golangci-lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - go/analysis
          - go/apps
          - go/containers
          - go/header
          - go/monitoring
          - go/ptypes
          - go/qms
          - go/requests
          - go/svcerror
          - go/user
          - goldens
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}
